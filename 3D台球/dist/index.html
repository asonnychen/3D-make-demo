<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120b07" />
    <meta name="description" content="九号俱乐部 CLUB No.9 —— Three.js + Rapier 制作的第一人称 3D 台球，自由练习与逐杆回放。" />
    <title>九号俱乐部 CLUB No.9 · 第一人称物理台球</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120805'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23d9ab63'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='28' font-weight='bold' text-anchor='middle' fill='%23120805'%3E9%3C/text%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="/assets/index-Dcthqe-C.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DwxNIPFX.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>

      <div id="ui">
        <div id="loading" class="loading">
          <div class="loading-mark">
            <div class="loading-ring"></div>
            <div class="loading-nine">9</div>
          </div>
          <h1 data-i18n="loading.title"></h1>
          <p data-i18n="loading.sub"></p>
        </div>

        <!-- 主菜单 -->
        <section id="menu" class="menu screen hidden">
          <div class="menu-top">
            <span class="menu-mark"><i>9</i> CLUB No.9</span>
            <button id="langBtnMenu" class="lang-pill">EN</button>
          </div>

          <div class="menu-main">
            <p class="eyebrow" data-i18n="menu.practice"></p>
            <h1 class="title" data-i18n="menu.title">九号俱乐部</h1>
            <p class="title-en" data-i18n="menu.titleEn">CLUB No.9</p>
            <p class="menu-subtitle" data-i18n="menu.subtitle"></p>
            <p class="tagline" data-i18n="menu.tagline"></p>
            <button id="startBtn" class="gold-btn start-btn" data-i18n="menu.start"></button>
            <p class="menu-hint">
              <span class="mouse-glyph" aria-hidden="true"></span>
              <span data-i18n="menu.hint"></span>
            </p>
          </div>

          <div class="menu-bottom">
            <button id="guideBtnMenu" class="text-btn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5v.01M12 11.5v5M4.5 12a7.5 7.5 0 1 0 15 0 7.5 7.5 0 0 0-15 0Z" /></svg>
              <span data-i18n="menu.guide"></span>
            </button>
            <div class="menu-bottom-right">
              <button id="settingsBtnMenu" class="text-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" /><path d="m19.4 13.5 1.4 1.1-1.8 3.1-1.7-.7a7.6 7.6 0 0 1-2 1.2l-.2 1.8h-3.6l-.2-1.8a7.6 7.6 0 0 1-2-1.2l-1.7.7-1.8-3.1 1.4-1.1a7.7 7.7 0 0 1 0-2.4L5.8 9.9l1.8-3.1 1.7.7a7.6 7.6 0 0 1 2-1.2l.2-1.8h3.6l.2 1.8a7.6 7.6 0 0 1 2 1.2l1.7-.7 1.8 3.1-1.4 1.1a7.7 7.7 0 0 1 0 2.4Z" /></svg>
                <span data-i18n="menu.settings"></span>
              </button>
              <button id="muteBtnMenu" class="text-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l4 3.5v-11L7 10H4Z" /><path d="M15 9.5a3.5 3.5 0 0 1 0 5M17.5 7a7 7 0 0 1 0 10" /></svg>
                <span id="muteMenuLabel" data-i18n="menu.mute"></span>
              </button>
            </div>
          </div>
        </section>

        <!-- 游戏 HUD -->
        <header id="hudTop" class="hud-top hidden">
          <div class="brand-mini">
            <span class="nine">9</span>
            <div>
              <strong>CLUB No.9</strong>
              <span data-i18n="hud.practice"></span>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><span data-i18n="hud.shots"></span><b id="shotCount">0</b></div>
            <div class="stat"><span data-i18n="hud.potted"></span><b id="pottedCount">0</b></div>
            <div class="stat"><span data-i18n="hud.remain"></span><b id="remainCount">15</b></div>
          </div>
          <div class="hud-actions">
            <button id="langBtnHud" class="icon-btn wide" data-i18n-title="menu.lang">EN</button>
            <button id="muteBtnHud" class="icon-btn" data-i18n-title="menu.mute">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l4 3.5v-11L7 10H4Z" /><path id="muteWave" d="M15 9.5a3.5 3.5 0 0 1 0 5M17.5 7a7 7 0 0 1 0 10" /></svg>
            </button>
            <button id="guideBtnHud" class="icon-btn" data-i18n-title="menu.guide">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5v.01M12 11.5v5M4.5 12a7.5 7.5 0 1 0 15 0 7.5 7.5 0 0 0-15 0Z" /></svg>
            </button>
            <button id="settingsBtnHud" class="icon-btn" data-i18n-title="menu.settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" /><path d="m19.4 13.5 1.4 1.1-1.8 3.1-1.7-.7a7.6 7.6 0 0 1-2 1.2l-.2 1.8h-3.6l-.2-1.8a7.6 7.6 0 0 1-2-1.2l-1.7.7-1.8-3.1 1.4-1.1a7.7 7.7 0 0 1 0-2.4L5.8 9.9l1.8-3.1 1.7.7a7.6 7.6 0 0 1 2-1.2l.2-1.8h3.6l.2 1.8a7.6 7.6 0 0 1 2 1.2l1.7-.7 1.8 3.1-1.4 1.1a7.7 7.7 0 0 1 0 2.4Z" /></svg>
            </button>
            <button id="pauseBtnHud" class="icon-btn" data-i18n-title="hud.pause">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12" /></svg>
            </button>
          </div>
        </header>

        <div id="pottedStrip" class="potted-strip hidden"></div>
        <div id="toast" class="toast" role="status"></div>

        <div id="powerWrap" class="power-wrap hidden">
          <div class="power-head">
            <span data-i18n="hud.power"></span>
            <b id="powerValue">0%</b>
          </div>
          <div class="power-track"><div id="powerFill" class="power-fill"></div></div>
          <span id="powerLabel" class="power-label"></span>
        </div>

        <div id="hudBottom" class="hud-bottom hidden">
          <div class="hud-hints">
            <span class="live-dot"></span>
            <span data-i18n="hud.aim"></span>
            <i>·</i>
            <span data-i18n="hud.shoot"></span>
          </div>
          <button id="replayBtn" class="pill-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7v10M17 7 10 12l7 5V7Z" /></svg>
            <span data-i18n="hud.replay"></span>
          </button>
          <div class="hud-keys" data-i18n="hud.keys"></div>
        </div>

        <div id="lockHint" class="lock-hint hidden" data-i18n="hud.locked"></div>

        <!-- 回放面板 -->
        <div id="replayPanel" class="modal hidden">
          <div class="modal-card replay-card">
            <div class="modal-head">
              <h2 data-i18n="replay.title"></h2>
              <button id="replayClose" class="close-x" aria-label="close">×</button>
            </div>
            <p class="modal-sub" data-i18n="replay.listHint"></p>
            <div id="replayList" class="shot-list"></div>
            <div id="replayPlayer" class="replay-player hidden">
              <div class="replay-meta">
                <span id="replayShotLabel"></span>
                <span id="replayClock">0.0s</span>
              </div>
              <input id="replayRange" type="range" min="0" max="1000" value="0" step="1" />
              <div class="replay-row">
                <button id="replayToggle" class="icon-btn" aria-label="play">▶</button>
                <button id="replayRestartBtn" class="line-btn" data-i18n="replay.restart"></button>
                <button id="replayExitBtn" class="gold-btn small" data-i18n="replay.exit"></button>
              </div>
            </div>
          </div>
        </div>

        <!-- 暂停 -->
        <section id="pause" class="pause screen hidden">
          <div class="pause-card">
            <p class="eyebrow" data-i18n="hud.pause"></p>
            <h2 data-i18n="pause.title"></h2>
            <p class="pause-sub" data-i18n="pause.sub"></p>
            <button id="resumeBtn" class="gold-btn" data-i18n="pause.resume"></button>
            <button id="rackBtnPause" class="line-btn" data-i18n="pause.rack"></button>
            <button id="menuBtnPause" class="line-btn" data-i18n="pause.menu"></button>
          </div>
        </section>

        <!-- 操作指南 -->
        <div id="guideModal" class="modal hidden">
          <div class="modal-card guide-card">
            <div class="modal-head">
              <div>
                <h2 data-i18n="guide.title"></h2>
                <p class="modal-sub" data-i18n="guide.sub"></p>
              </div>
              <button id="guideClose" class="close-x" aria-label="close">×</button>
            </div>

            <div class="guide-grid">
              <div class="guide-col">
                <h3 data-i18n="guide.mouseTitle"></h3>
                <div class="guide-row">
                  <span class="key" data-i18n="guide.mouseKey">鼠标</span>
                  <div><b data-i18n="guide.mouseAim"></b><em data-i18n="guide.mouseAimDesc"></em></div>
                </div>
                <div class="guide-row">
                  <span class="key" data-i18n="guide.leftKey">左键</span>
                  <div><b data-i18n="guide.mouseCharge"></b><em data-i18n="guide.mouseChargeDesc"></em></div>
                </div>
                <h3 data-i18n="guide.keyboardTitle"></h3>
                <div class="guide-row"><span class="key">R</span><div><b data-i18n="guide.keyR"></b><em data-i18n="guide.keyRDesc"></em></div></div>
                <div class="guide-row"><span class="key">L</span><div><b data-i18n="guide.keyL"></b><em data-i18n="guide.keyLDesc"></em></div></div>
                <div class="guide-row"><span class="key">M</span><div><b data-i18n="guide.keyM"></b><em data-i18n="guide.keyMDesc"></em></div></div>
                <div class="guide-row"><span class="key">H</span><div><b data-i18n="guide.keyH"></b><em data-i18n="guide.keyHDesc"></em></div></div>
                <div class="guide-row"><span class="key">Esc</span><div><b data-i18n="guide.keyEsc"></b><em data-i18n="guide.keyEscDesc"></em></div></div>
              </div>
              <div class="guide-col rules">
                <h3 data-i18n="guide.rulesTitle"></h3>
                <p data-i18n="guide.rule1"></p>
                <p data-i18n="guide.rule2"></p>
                <p data-i18n="guide.rule3"></p>
                <div class="guide-badge"><span>9</span> <i data-i18n="guide.badge"></i></div>
              </div>
            </div>
            <button id="guideDone" class="gold-btn" data-i18n="guide.close"></button>
          </div>
        </div>

        <!-- 设置 -->
        <div id="settingsModal" class="modal hidden">
          <div class="modal-card settings-card">
            <div class="modal-head">
              <div>
                <h2 data-i18n="settings.title"></h2>
                <p class="modal-sub" data-i18n="settings.sub"></p>
              </div>
              <button id="settingsClose" class="close-x" aria-label="close">×</button>
            </div>

            <label class="setting-row">
              <span data-i18n="settings.sens"></span>
              <input id="sensRange" type="range" min="0.3" max="2.4" step="0.1" value="1" />
              <b id="sensValue">1.0×</b>
            </label>
            <label class="setting-row">
              <span data-i18n="settings.volume"></span>
              <input id="volumeRange" type="range" min="0" max="1" step="0.05" value="0.7" />
              <b id="volumeValue">70%</b>
            </label>
            <div class="setting-row">
              <span data-i18n="settings.quality"></span>
              <div class="segmented" id="qualitySeg">
                <button data-quality="high" class="active" data-i18n="settings.high"></button>
                <button data-quality="low" data-i18n="settings.low"></button>
              </div>
            </div>

            <button id="settingsDone" class="gold-btn" data-i18n="settings.close"></button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
